<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fate's Hand Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="kicker">FATE'S HAND</p>
      <h1>AboveVTT Bridge</h1>
      <label>
        Campaign code
        <input id="code" maxlength="24" autocomplete="off" placeholder="FH2">
      </label>
      <div class="actions">
        <button id="start" type="button">Connect</button>
        <button id="stop" type="button" class="ghost">Stop</button>
      </div>
      <p id="status" role="status" aria-live="polite">Loading status…</p>
      <small>Plain resolved text only. This bridge never asks AboveVTT to reroll.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
